name: Integrated pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-and-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install non-training dependencies
        run: |
          python -m pip install -r Phase2_Blockchain_Logging/requirements.txt -r Phase3_Performance_Optimization/requirements.txt
      - name: Test integrated launcher and dataset-independent modules
        run: |
          python -m pytest -q tests/test_main_pipeline.py Phase2_Blockchain_Logging/tests Phase3_Performance_Optimization/tests/test_async_pipeline.py Phase3_Performance_Optimization/tests/test_local_cache.py Phase3_Performance_Optimization/tests/test_resource_profiler.py Phase3_Performance_Optimization/tests/test_comparative_benchmark.py
      - name: Three-phase synthetic smoke
        run: python main.py all --mode smoke --limit 21 --repeats 2 --run-dir runs/ci-smoke
      # Do not upload runs wholesale: the local signing identities contain keys.
      - name: Upload non-secret diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostics-python-${{ matrix.python-version }}
          path: |
            runs/ci-smoke/manifest.json
            runs/ci-smoke/*.log
            runs/ci-smoke/phase2/results.json
            runs/ci-smoke/phase3/results.json
