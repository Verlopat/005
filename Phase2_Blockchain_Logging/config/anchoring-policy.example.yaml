policy_version: 2

# Calibrated, confidence-gated anchoring policy for the Phase 1 detection layer
# (LightGBM multiclass, NF-CSE-CIC-IDS2018-v2, isotonic-calibrated confidence).
#
# Every numeric value below is traceable to a Phase 1 artefact. None of them is
# a guess, and none is tuned to make a target pass.
#
#   Phase_1/outputs/09_model/model_card.json          -> anchoring_gate
#   Phase_1/outputs/08_calibration_icr/
#       icr_operating_points.csv                      -> tau per ICR target
#       icr_per_class.csv                             -> per-class ICR and
#                                                        mean confidence

# Anchor only attack verdicts. Benign flows are the overwhelming majority
# (natural ~88% benign prior on the held-out fold) and anchoring them would
# spend ledger capacity on non-evidence.
anchor_attack_only: true

# Global gate. Phase 1 selects tau = 0.9997655153274536 to meet an Integrity
# Coverage Ratio target of 0.95, achieving ICR 0.9568 at 11.43% on-chain volume
# (88.57% ledger write reduction, anchor precision 0.999998).
#
# A category-specific threshold below takes precedence over this value.
confidence_threshold: 0.9997655153274536

# Class-aware gate flooring (Objective 3).
#
# A single global gate is not class-neutral. Phase 1 measures Infiltration at
# mean calibrated confidence 0.303 - by far the lowest of the seven categories,
# because the dataset's infiltration flows are largely indistinguishable from
# benign traffic at the NetFlow level. At the global tau above, Infiltration is
# the first category excluded, so the events most worth investigating would be
# the ones with no on-chain evidence.
#
# The floor below is the tau at which Phase 1's own operating-point table
# reaches an ICR target of 0.999, where Infiltration retains ICR 0.983
# (icr_per_class.csv, tau = 0.002786220982670784). It is therefore a documented
# policy choice grounded in a measured curve, not a hand-picked constant.
#
# Cost of this floor: Infiltration events are anchored far more liberally than
# other categories, which raises on-chain volume for that category. That is the
# intended trade - evidentiary completeness for the hardest class, purchased
# with ledger capacity, and disclosed rather than hidden.
category_thresholds:
  Infiltration: 0.002786220982670784

  # Web Attacks is the rarest category (~1 in 4,750 vs benign, 665 flows in the
  # test fold) but Phase 1 measures its mean confidence at 0.994, so it clears
  # the global gate without a floor. Listed explicitly with the global value so
  # a future retrain that degrades this class is a visible policy edit rather
  # than a silent coverage loss.
  Web Attacks: 0.9997655153274536

# Immediate (own-transaction) anchoring vs Merkle-batched anchoring.
#
# Batching is a throughput dependency, not an optimisation: at Objective 3's
# 10,000 events/sec peak and the 11.43% anchoring rate, unbatched anchoring
# requires ~1,143 ledger transactions/sec, above the 1,000 TPS budget recorded
# in Phase_1/outputs/10_contract/capacity_table.csv. Reserving immediate
# anchoring for the highest-confidence attacks keeps the batch path as the
# default.
immediate_confidence_threshold: 0.99

# Severity is carried through from Phase 1's severity_map.json and is not
# re-derived from confidence here; this block only names the vocabulary used
# when a producer supplies no severity at all.
severity_by_threat:
  ATTACK: "high"
  BENIGN: "informational"
